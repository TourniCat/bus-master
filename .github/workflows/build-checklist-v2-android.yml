name: Build Checklist V2 Android

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/checklist-v2-build
    paths:
      - 'checklist-v2/android-native-v2/**'
      - '.github/workflows/build-checklist-v2-android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct Android native source
        shell: bash
        run: |
          set -euo pipefail
          cat checklist-v2/android-native-v2/part*.txt > /tmp/android-native.b64
          base64 --decode /tmp/android-native.b64 > /tmp/android-native.tar.xz
          sha256sum /tmp/android-native.tar.xz
          xz -t /tmp/android-native.tar.xz
          mkdir -p /tmp/androidsrc
          tar -xJf /tmp/android-native.tar.xz -C /tmp/androidsrc
          find /tmp/androidsrc -maxdepth 3 -type f | sort | head -80
      - name: Restore shared UI from Windows source payload
        shell: bash
        run: |
          set -euo pipefail
          cat checklist-v2/windows/part00.txt checklist-v2/windows/part01.txt > /tmp/windows.b64
          cat checklist-v2/windows-fix/02-*.txt | sort >/dev/null 2>&1 || true
          for f in $(find checklist-v2/windows-fix -name '02-*.txt' | sort); do cat "$f" >> /tmp/windows.b64; done
          for f in $(find checklist-v2/windows-fix -name '03-*.txt' | sort); do cat "$f" >> /tmp/windows.b64; done
          cat checklist-v2/windows/part04.txt checklist-v2/windows/part05.txt checklist-v2/windows/part06.txt checklist-v2/windows/part07.txt >> /tmp/windows.b64
          base64 --decode /tmp/windows.b64 > /tmp/windows.zip
          mkdir -p /tmp/windowssrc
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          out=Path('/tmp/windowssrc')
          with zipfile.ZipFile('/tmp/windows.zip') as z:
              for info in z.infolist():
                  if info.filename.endswith('/web/checklist-data.js'):
                      continue
                  try:
                      z.extract(info, out)
                  except zipfile.BadZipFile:
                      raise
          web=out/'windows'/'web'
          data=json.loads((web/'checklist.json').read_text(encoding='utf-8'))
          (web/'checklist-data.js').write_text(
              'window.INITIAL_CHECKLIST = '+json.dumps(data,ensure_ascii=False,separators=(',',':'))+';\n',
              encoding='utf-8'
          )
          PY
          node --check /tmp/windowssrc/windows/web/core.js
          node --check /tmp/windowssrc/windows/web/app.js
          rm -rf /tmp/androidsrc/app/src/main/assets/web
          mkdir -p /tmp/androidsrc/app/src/main/assets/web
          cp -a /tmp/windowssrc/windows/web/. /tmp/androidsrc/app/src/main/assets/web/
          test -f /tmp/androidsrc/app/src/main/assets/web/index.html
          test -f /tmp/androidsrc/app/src/main/assets/web/core.js
          node --check /tmp/androidsrc/app/src/main/assets/web/core.js
          node --check /tmp/androidsrc/app/src/main/assets/web/app.js
          test -f /tmp/androidsrc/app/src/main/java/com/absolute/checklist/MainActivity.java
      - name: Apply battery-safe backup policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/androidsrc/app/src/main/java/com/absolute/checklist/BackupWorker.java')
          s=p.read_text(encoding='utf-8')
          s=s.replace('catch(SecurityException e){return Result.retry();}', 'catch(SecurityException e){return Result.success();}')
          s=s.replace('catch(Exception e){return Result.retry();}', 'catch(Exception e){return Result.success();}')
          p.write_text(s, encoding='utf-8')
          assert 'Result.retry()' not in p.read_text(encoding='utf-8')
          q=Path('/tmp/androidsrc/app/src/main/java/com/absolute/checklist/MainActivity.java')
          t=q.read_text(encoding='utf-8')
          t=t.replace('public String appInfo(String ignored){JSONObject o=new JSONObject();try{o.put("deviceId",storage.getDeviceId()).put("deviceLabel",storage.getDeviceLabel()).put("version","2.0.0 Android");}catch(Exception ignored){}',
                      'public String appInfo(String ignored){JSONObject o=new JSONObject();try{o.put("deviceId",storage.getDeviceId()).put("deviceLabel",storage.getDeviceLabel()).put("version","2.0.0 Android");}catch(Exception ex){}')
          t=t.replace('private WebView web; private FrameLayout root; private boolean unlocked=false; private boolean pageReady=false; private String exportPending="";',
                      'private WebView web; private FrameLayout root; private boolean unlocked=false; private volatile boolean pageReady=false; private final java.util.List<String[]> pendingStates=java.util.Collections.synchronizedList(new java.util.ArrayList<>()); private String exportPending="";')
          t=t.replace('web.setWebViewClient(new WebViewClient(){@Override public void onPageFinished(WebView view,String url){pageReady=true;pushStatus(false,"","로컬");}});',
                      'web.setWebViewClient(new WebViewClient(){@Override public void onPageFinished(WebView view,String url){pageReady=true;synchronized(pendingStates){for(String[] x:pendingStates)eval("window.App&&App.receiveRemoteState("+JSONObject.quote(x[0])+","+JSONObject.quote(x[1])+")");pendingStates.clear();}pushStatus(false,"","로컬");}});')
          t=t.replace('@Override public void deliverState(String state,String source){eval("window.App&&App.receiveRemoteState("+JSONObject.quote(state)+","+JSONObject.quote(source)+")");}',
                      '@Override public void deliverState(String state,String source){if(pageReady)eval("window.App&&App.receiveRemoteState("+JSONObject.quote(state)+","+JSONObject.quote(source)+")");else pendingStates.add(new String[]{state,source});}')
          q.write_text(t, encoding='utf-8')
          lan=Path('/tmp/androidsrc/app/src/main/java/com/absolute/checklist/LanSyncClient.java')
          v=lan.read_text(encoding='utf-8')
          old='socket=s;writer=w;listener.onStatus(true,host.getHostAddress());exec.execute(()->readLoop(s,reader));'
          new='socket=s;writer=w;listener.onStatus(true,host.getHostAddress());sendState(storage.readStateOrLegacy());exec.execute(()->readLoop(s,reader));'
          if old not in v: raise SystemExit('LAN initial-send patch target not found')
          lan.write_text(v.replace(old,new),encoding='utf-8')
          for name in ('backup_rules.xml','data_extraction_rules.xml'):
              x=Path('/tmp/androidsrc/app/src/main/res/xml')/name
              u=x.read_text(encoding='utf-8')
              u=u.replace('        <exclude domain="sharedpref" path="checklist_secure.xml" />\n','')
              u=u.replace('    <exclude domain="sharedpref" path="checklist_secure.xml" />\n','')
              x.write_text(u, encoding='utf-8')
          PY
      - name: Enable AndroidX
        shell: bash
        run: |
          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' >> /tmp/androidsrc/gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.10.2
        shell: bash
        run: |
          curl -fsSL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build native compile smoke
        working-directory: /tmp/androidsrc
        shell: bash
        run: /tmp/gradle-8.10.2/bin/gradle :app:compileDebugJavaWithJavac --stacktrace --no-daemon
      - name: Build release APK
        working-directory: /tmp/androidsrc
        shell: bash
        run: /tmp/gradle-8.10.2/bin/gradle :app:assembleRelease --stacktrace --no-daemon
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          cp /tmp/androidsrc/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/out/AbsoluteChecklist-v2.0.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/out/apksigner.jar
          sha256sum /tmp/out/*
      - uses: actions/upload-artifact@v4
        with:
          name: checklist-v2-android-unsigned
          path: /tmp/out/*
          retention-days: 7
