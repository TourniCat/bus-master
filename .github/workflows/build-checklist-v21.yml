name: Build Checklist V2.1
on:
  push:
    branches: [chatgpt/checklist-v21-build]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct v2.1 source
        shell: bash
        run: |
          set -euo pipefail
          cat checklist-v21/blob-*.txt | base64 -d > /tmp/overlay.tar.xz
          echo "34bbef51b18abb1bcd0ebbc5f910459e7b07fceee702cd2284862ec78ab02d9a  /tmp/overlay.tar.xz" | sha256sum -c -
          xz -t /tmp/overlay.tar.xz
          rm -rf /tmp/overlay && mkdir -p /tmp/overlay
          tar -xJf /tmp/overlay.tar.xz -C /tmp/overlay
          echo "archive paths:"; find /tmp/overlay -maxdepth 4 -type f | sort
          test -f /tmp/overlay/shared-web/app.js || { echo "missing web app"; exit 9; }
          test -f /tmp/overlay/gateway/checklist_sync.py || { echo "missing gateway sync"; exit 10; }
          echo "checking web JS"; node --check /tmp/overlay/shared-web/app.js || exit 11
          echo "checking gateway Python"; python -m py_compile /tmp/overlay/gateway/checklist_sync.py || exit 12
          echo "checking UI marker"
          grep -q "캐셔 설정" /tmp/overlay/shared-web/index.html || { echo "missing cashier settings UI"; exit 21; }
          grep -Eqi "password|비밀번호" /tmp/overlay/shared-web/app.js || { echo "missing password flow"; exit 22; }
          grep -Eqi "cashier|캐셔" /tmp/overlay/gateway/checklist_sync.py || { echo "missing cashier sync"; exit 23; }
          grep -Eqi "toast|snackbar|알림" /tmp/overlay/shared-web/app.js || { echo "missing result notification"; exit 24; }
      - name: Core logic tests
        run: node --test /tmp/overlay/tests/core.test.js
      - name: Android project structure
        run: |
          test -f /tmp/overlay/android/app/build.gradle
          test -f /tmp/overlay/android/app/src/main/AndroidManifest.xml
          find /tmp/overlay/android/app/src/main -type f | sort | head -100
      - name: Windows project compile
        shell: bash
        run: |
          dotnet --version
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/overlay/windows/AppStorage.cs'); s=p.read_text(encoding='utf-8')
          s=s.replace('var salt=Convert.FromBase64String(Secure.PasswordSalt),expected=Convert.FromBase64String(Secure.PasswordHash),actual=Rfc2898DeriveBytes.Pbkdf2(value,salt,120000,HashAlgorithmName.SHA256,32);','var salt=Convert.FromBase64String(Secure.PasswordSalt);var expected=Convert.FromBase64String(Secure.PasswordHash);var actual=Rfc2898DeriveBytes.Pbkdf2(value,salt,120000,HashAlgorithmName.SHA256,32);')
          p.write_text(s,encoding='utf-8')
          p=Path('/tmp/overlay/windows/MainWindow.xaml.cs'); s=p.read_text(encoding='utf-8')
          s=s.replace('var cur=args["currentPassword"]?.GetValue<string>()??"",next=args["newPassword"]?.GetValue<string>()??"";','var cur=args["currentPassword"]?.GetValue<string>()??"";var next=args["newPassword"]?.GetValue<string>()??"";')
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          for p in [Path('/tmp/overlay/windows/AppStorage.cs'),Path('/tmp/overlay/windows/MainWindow.xaml.cs')]:
              for i,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
                  if 'var ' in line and ',' in line and ';' in line:
                      print(f'{p}:{i}:{line}')
          PY
          dotnet build /tmp/overlay/windows/AbsoluteChecklist.Windows.csproj -c Release -p:EnableWindowsTargeting=true
      - name: Android SDK 35 release build
        shell: bash
        run: |
          set -euo pipefail
          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' >> /tmp/overlay/android/gradle.properties
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          curl -fsSL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          cd /tmp/overlay/android
          /tmp/gradle-8.10.2/bin/gradle :app:compileDebugJavaWithJavac :app:assembleRelease --stacktrace --no-daemon
          mkdir -p /tmp/out
          cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/out/MiRA-Checklist-Android-v2.1.0-unsigned.apk
          keytool -genkeypair -v -keystore /tmp/mira-v21-release.jks -storepass mira210release -keypass mira210release -alias mira-v21 -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=MiRA Checklist, OU=Absolute Universe, O=MiRA, C=KR"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 /tmp/out/MiRA-Checklist-Android-v2.1.0-unsigned.apk /tmp/out/MiRA-Checklist-Android-v2.1.0-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/mira-v21-release.jks --ks-pass pass:mira210release --key-pass pass:mira210release --ks-key-alias mira-v21 --out /tmp/out/MiRA-Checklist-Android-v2.1.0.apk /tmp/out/MiRA-Checklist-Android-v2.1.0-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/out/MiRA-Checklist-Android-v2.1.0.apk
          cp /tmp/mira-v21-release.jks /tmp/out/MiRA-Checklist-v2.1-release-key.jks
      - name: Windows x64 publish
        shell: bash
        run: |
          dotnet publish /tmp/overlay/windows/AbsoluteChecklist.Windows.csproj -c Release -r win-x64 --self-contained true -p:EnableWindowsTargeting=true -p:PublishSingleFile=false -p:DebugType=None -o /tmp/winpublish
          cd /tmp/winpublish && zip -qr /tmp/out/MiRA-Checklist-Windows-v2.1.0-win-x64.zip .
      - name: Hash deliverables
        run: sha256sum /tmp/out/*
      - uses: actions/upload-artifact@v4
        with:
          name: MiRA-Checklist-v2.1.0-builds
          path: /tmp/out/*
          retention-days: 7
      - name: Package verified source
        run: cp /tmp/overlay.tar.xz MiRA-Checklist-v2.1.0-source.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: MiRA-Checklist-v2.1.0-source
          path: MiRA-Checklist-v2.1.0-source.tar.xz
          retention-days: 7
